name: HistoryGuide checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: historyguide-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
      - name: Install hash-locked development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
          .venv/bin/python -m pip check
      - name: Run backend tests
        run: |
          set +e
          .venv/bin/python -m pytest -o addopts= -q --junitxml=.pytest-report.xml
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            .venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(".pytest-report.xml")
          if report.exists():
              failures = []
              for case in ET.parse(report).iterfind(".//testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is not None:
                      failures.append((case, failure))
              for case, failure in failures[:20]:
                  path = case.get("file", "historyguide-backend/tests")
                  line = case.get("line", "1")
                  name = f"{case.get('classname', '')}.{case.get('name', 'pytest failure')}"
                  detail = (failure.get("message") or (failure.text or "")).strip().splitlines()[0]
                  message = f"{name}: {detail}".replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error file={path},line={line},title=pytest::{message}")
          PY
          fi
          exit "$status"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser test dependencies
        working-directory: historyguide-backend/tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run isolated operator browser tests
        working-directory: historyguide-backend/tests/browser
        run: npm test
      - name: Build locked backend image
        run: docker build --pull --tag nk-historyguide:ci .
      - name: Smoke-test image without exposing a port
        run: |
          cid=$(docker run --detach --rm \
            --env HISTORYGUIDE_DATABASE_URL=sqlite:////tmp/historyguide-ci.db \
            --env HISTORYGUIDE_SCHEMA_MODE=auto_create \
            nk-historyguide:ci)
          trap 'docker rm --force "$cid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$cid" python -c \
              'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=2)' \
              >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$cid"
          exit 1
